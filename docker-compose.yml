services:
  iris:
    # image: intersystemsdc/iris-community:2026.1
    # image: ghcr.io/<owner>/<repo>:latest   # this repo's own GHCR image — see README's "Published Image"
    # Building from the Dockerfile to add embedded Python packages and the
    # IPM analytics modules (see Dockerfile for the module list). CI publishes
    # the built image to GHCR on push to master (see .github/workflows/publish.yml)
    # — swap to the "image:" line above to pull it instead of building locally:
    build: .
    ports:
      - "${IRIS_PORT:-52773}:52773"
      - "${IRIS_SUPER_PORT:-1972}:1972"
    volumes:
      - iris-data:/usr/irissys/mgr
      # Uncomment to mount source files for live editing:
      # - ./src:/irisdev/app/src
    environment:
      - IRIS_PASSWORD=${IRIS_PASSWORD:-SYS}
      - IRIS_USERNAME=${IRIS_USERNAME:-_SYSTEM}
      # Uncomment to apply a CPF merge file at startup:
      # - ISC_CPF_MERGE_FILE=/config/merge.cpf
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "iris qlist IRIS | grep -q running"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  iris-data:
